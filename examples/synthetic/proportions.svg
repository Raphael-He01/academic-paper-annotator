<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Synthetic recall and false alert proportions"><rect width="800" height="400" fill="#faf8f3"/><g fill="#14253d" font-family="sans-serif" font-size="20"><text x="40" y="40">Synthetic rules: benefits and false alerts</text><text x="40" y="105">Recall (denominator 40)</text><text x="40" y="245">False alerts (denominator 160)</text></g><g fill="#9dbfe8"><rect x="260" y="75" width="325" height="32"/><rect x="260" y="215" width="25" height="32"/></g><g fill="#a9d8b5"><rect x="260" y="125" width="437.5" height="32"/><rect x="260" y="265" width="46.875" height="32"/></g><g fill="#14253d" font-family="sans-serif" font-size="17"><text x="180" y="98">Rule A</text><text x="180" y="148">Rule B</text><text x="180" y="238">Rule A</text><text x="180" y="288">Rule B</text><text x="600" y="98">65%</text><text x="710" y="148">87.5%</text><text x="320" y="238">5%</text><text x="320" y="288">9.375%</text><text x="40" y="365">Authored arithmetic fixture. No patients or trained models.</text></g></svg>
