name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s academic-paper-annotator/scripts -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python academic-paper-annotator/scripts/build_workbench.py --data examples/synthetic --output examples/synthetic/index.html
      - run: git diff --exit-code -- examples/synthetic/index.html
      - run: >-
          python academic-paper-annotator/scripts/validate_release.py
          --html examples/synthetic/index.html --units examples/synthetic/units.json
          --baseline examples/synthetic/baseline.json --figures examples/synthetic/figures.json
          --tables examples/synthetic/tables.json --analysis examples/synthetic/analysis.json
          --review examples/synthetic/review.json --report examples/synthetic/release-report.json
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test tests/workbench.test.cjs
